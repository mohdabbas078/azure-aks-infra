apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: db-password
  namespace: database
spec:
  provider: azure
  secretObjects:
    - secretName: db-secret
      type: Opaque
      data:
        - objectName: DB-PASSWORD
          key: DB_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "49bb91ea-a36c-4451-89cf-d8f14bbad37e"
    keyvaultName: keyvaultobservabilitydev
    tenantId: "ae4b0fe3-c6df-4bcb-af3e-802b64b164e4"
    objects: |
      array:
        - |
          objectName: DB-PASSWORD
          objectAlias: DB-PASSWORD
          objectType: secret