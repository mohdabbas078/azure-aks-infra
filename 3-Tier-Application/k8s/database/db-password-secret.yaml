kind: SecretProviderClass
metadata:
  name: db-password
  namespace: database
spec:
  provider: azure
  secretObjects:
    - secretName: db-secret
      type: Opaque
      data:
        - objectName: DB-PASSWORD
          key: DB_PASSWORD
